name: "Release Tauri App"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-standard:
    name: Build Linux x86_64
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-20.04"
            target: "x86_64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-20.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        working-directory: autosen-tauri
        run: npm install

      - name: Build & Draft Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: autosen-tauri
          tagName: autoSen-v__VERSION__
          releaseName: "AutoSen v__VERSION__"
          releaseBody: "智能化业务处理终端 AutoSen 新版本发布。\n- 专注于国产 Linux 发行版（如麒麟系统、UOS）离线部署支持。\n- 基于 Ubuntu 20.04 (GLIBC 2.31) 构建，具备极高的向后兼容性。"
          releaseDraft: true
          prerelease: false
          args: ""

  build-linux-arm64:
    name: Build Linux ARM64
    permissions:
      contents: write
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: Build ARM64 on Ubuntu 20.04 (QEMU)
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu20.04
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          install: |
            apt-get update -y
            DEBIAN_FRONTEND=noninteractive apt-get install -y curl build-essential libwebkit2gtk-4.0-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          run: |
            source $HOME/.cargo/env
            cd autosen-tauri
            npm install
            npm run tauri build
            
            # Copy output to workspace root for artifact upload
            mkdir -p ../artifacts
            cp src-tauri/target/release/bundle/deb/*.deb ../artifacts/
            cp src-tauri/target/release/bundle/appimage/*.AppImage ../artifacts/ || true

      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoSen-linux-arm64
          path: artifacts/*
