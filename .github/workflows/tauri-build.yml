name: Build AutoSen Linux DEB

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'autosen-tauri/**'
      - '.github/workflows/tauri-build.yml'
  pull_request:
    paths:
      - 'autosen-tauri/**'
      - '.github/workflows/tauri-build.yml'
  workflow_dispatch:

concurrency:
  group: autosen-deb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} (glibc 2.31)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check tag and application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          app_version="$(node -p "require('./autosen-tauri/package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${app_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${app_version}" >&2
            exit 1
          fi

      - name: Build glibc 2.31 toolchain image
        run: |
          docker build \
            --file autosen-tauri/packaging/Dockerfile.glibc231 \
            --tag autosen-builder:glibc231 \
            autosen-tauri/packaging

      - name: Build and verify DEB
        run: |
          docker run --rm \
            --env EXPECTED_ARCH=${{ matrix.arch }} \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/autosen-tauri \
            autosen-builder:glibc231 \
            bash packaging/ci-build-deb.sh

      - name: Upload ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoSen-linux-${{ matrix.arch }}-glibc231
          path: autosen-tauri/artifacts/${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          pattern: AutoSen-linux-*-glibc231
          path: release-assets
          merge-multiple: true

      - name: Create release and upload DEBs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "AutoSen $GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
