name: Build and Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
    - name: Run Tests
      run: python test_core.py

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            name: linux-x86_64
          - os: windows-latest
            arch: x86_64
            name: windows-x86_64
            
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
        
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y python3-tk tk-dev
        python -m pip install --upgrade pip
        pip install pyinstaller chardet
        
    - name: Build with PyInstaller
      run: pyinstaller --noconfirm --onefile --windowed --name autoHao_${{ matrix.name }} main.py
        
    - name: Build Debian Package
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        if [[ $VERSION == *"/"* ]] || [ -z "$VERSION" ]; then VERSION="1.0.2"; fi
        mkdir -p build_deb/usr/bin
        mkdir -p build_deb/usr/share/applications
        mkdir -p build_deb/DEBIAN
        cp dist/autoHao_${{ matrix.name }} build_deb/usr/bin/autoHao
        chmod +x build_deb/usr/bin/autoHao
        cat <<EOF > build_deb/DEBIAN/control
        Package: autohao
        Version: ${VERSION}
        Section: utils
        Priority: optional
        Architecture: amd64
        Maintainer: AutoHao Team <team@example.com>
        Description: AutoHao automated processing tool
        EOF
        cat <<EOF > build_deb/usr/share/applications/autohao.desktop
        [Desktop Entry]
        Version=1.0
        Name=AutoHao
        Exec=/usr/bin/autoHao
        Terminal=false
        Type=Application
        Icon=system-run
        Categories=Utility;
        EOF
        dpkg-deb --build build_deb dist/autoHao_${{ matrix.name }}.deb
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: autoHao_${{ matrix.name }}
        path: dist/autoHao_${{ matrix.name }}*
        
    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/autoHao_${{ matrix.name }}*

  build-arm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        
      - name: Build on ARM64
        run: |
          docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/workspace -w /workspace python:3.8-slim bash -c "\
          apt-get update && apt-get install -y binutils python3-tk tk-dev && \
          pip install pyinstaller chardet && \
          pyinstaller --noconfirm --onefile --windowed --name autoHao_linux-arm64 main.py"
          sudo chown -R $USER:$USER dist build || true
          
      - name: Build Debian Package (ARM64)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [[ $VERSION == *"/"* ]] || [ -z "$VERSION" ]; then VERSION="1.0.2"; fi
          mkdir -p build_deb/usr/bin
          mkdir -p build_deb/usr/share/applications
          mkdir -p build_deb/DEBIAN
          cp dist/autoHao_linux-arm64 build_deb/usr/bin/autoHao
          chmod +x build_deb/usr/bin/autoHao
          cat <<EOF > build_deb/DEBIAN/control
          Package: autohao
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: arm64
          Maintainer: AutoHao Team <team@example.com>
          Description: AutoHao automated processing tool
          EOF
          cat <<EOF > build_deb/usr/share/applications/autohao.desktop
          [Desktop Entry]
          Version=1.0
          Name=AutoHao
          Exec=/usr/bin/autoHao
          Terminal=false
          Type=Application
          Icon=system-run
          Categories=Utility;
          EOF
          dpkg-deb --build build_deb dist/autoHao_linux-arm64.deb
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoHao_linux-arm64
          path: dist/autoHao_linux-arm64*
          
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/autoHao_linux-arm64*
