name: Build and Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
    - name: Run Tests
      run: python test_core.py

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            name: linux-x86_64
          - os: windows-latest
            arch: x86_64
            name: windows-x86_64
            
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller chardet
        
    - name: Build with PyInstaller
      run: pyinstaller --noconfirm --onefile --windowed --name autoHao_${{ matrix.name }} main.py
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: autoHao_${{ matrix.name }}
        path: dist/autoHao_${{ matrix.name }}*
        
    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/autoHao_${{ matrix.name }}*

  build-arm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        
      - name: Build on ARM64
        run: |
          docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/workspace -w /workspace python:3.8-slim bash -c "\
          pip install pyinstaller chardet && \
          apt-get update && apt-get install -y binutils && \
          pyinstaller --noconfirm --onefile --windowed --name autoHao_linux-arm64 main.py"
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoHao_linux-arm64
          path: dist/autoHao_linux-arm64*
          
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/autoHao_linux-arm64*
