[package]
name = "autosen-tauri"
version = "1.0.8"
description = "麒麟平台压缩包自动监控、解压、重命名与文本整理工具"
authors = ["Hao"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "system-tray", "shell-all", "path-all", "fs-all", "dialog-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
chrono = "0.4"
dirs = "5.0"
walkdir = "2.5.0"

