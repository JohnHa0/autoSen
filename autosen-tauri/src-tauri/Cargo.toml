[package]
name = "autosen-tauri"
version = "1.0.6"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "system-tray", "shell-all", "path-all", "fs-all", "dialog-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "0.6"
encoding_rs = "0.8"
regex = "1.10"
chrono = "0.4"
csv = "1.3"
log = "0.4"
notify = "6.1.1"
dirs = "5.0"
walkdir = "2.5.0"

